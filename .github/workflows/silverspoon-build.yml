name: Build SilverSpoon

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore dependencies
        run: dotnet restore src/LuaToolsGui.csproj

      - name: Build Release
        run: dotnet build src/LuaToolsGui.csproj --configuration Release --no-restore

      - name: Publish
        run: dotnet publish src/LuaToolsGui.csproj --configuration Release --no-restore -p:PublishSingleFile=false -p:AppxPackageignoredAPI=rxconstruct

      - name: Upload SilverSpoon artifact
        uses: actions/upload-artifact@v4
        with:
          name: silverspoon-build
          path: src/bin/Release/net8.0-windows/SilverSpoon.exe
          if-no-files-found: error
