name: Build SilverSpoon Desktop

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build .NET 8 WPF App
    runs-on: windows-latest
    needs: build-native

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore .\src\LuaToolsGui.csproj

      - name: Build Release
        run: dotnet build .\src\LuaToolsGui.csproj --configuration Release --no-restore

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: silverspoon-desktop
          path: |
            src/bin/Release/net8.0-windows/**/*
          retention-days: 7

      - name: Download native artifacts for installer
        uses: actions/download-artifact@v4
        with:
          name: silverspoon-native
          path: artifacts/native

      - name: Package SilverSpoon installer bundle
        shell: pwsh
        run: |
          $package = Join-Path $env:GITHUB_WORKSPACE 'artifacts/SilverSpoon'
          New-Item -ItemType Directory -Path $package -Force | Out-Null
          Get-ChildItem (Join-Path $env:GITHUB_WORKSPACE 'artifacts/native') -Filter '*.dll' -Recurse | Copy-Item -Destination $package
          Copy-Item 'src/bin/Release/net8.0-windows/SilverSpoon.exe' $package
          Copy-Item 'millennium-silverspoon/install_silverspoon.lua' $package
          Copy-Item 'millennium-silverspoon/install_silverspoon.ps1' $package
          Copy-Item 'millennium-silverspoon/SilverSpoon-Store-Companion.zip' $package

      - name: Upload installer bundle
        uses: actions/upload-artifact@v4
        with:
          name: silverspoon-installer
          path: artifacts/SilverSpoon/**
          retention-days: 7

  build-native:
    name: Build SilverSpoon Native (C++)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify CMake
        shell: pwsh
        run: cmake --version

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build native
        run: .\build.bat
        working-directory: .

      - name: Upload native artifacts
        uses: actions/upload-artifact@v4
        with:
          name: silverspoon-native
          path: |
            build/Release/*.dll
          retention-days: 7
